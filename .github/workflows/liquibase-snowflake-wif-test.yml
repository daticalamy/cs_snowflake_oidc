# Put changelog.yaml at the repo root. Run it manually from the Actions tab (on the main branch).

name: Liquibase Snowflake WIF (OIDC) test

on:
  workflow_dispatch:

permissions:
  id-token: write   # required for GitHub to issue an OIDC token
  contents: read

env:
  SF_ACCOUNT: ${{ vars.SF_ACCOUNT }}
  LB_IMAGE: liquibase/liquibase-secure:latest
  LIQUIBASE_LICENSE_KEY: ${{ secrets.LIQUIBASE_LICENSE_KEY }}

jobs:
  test:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Get GitHub OIDC token (audience = snowflakecomputing.com)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=snowflakecomputing.com" | jq -r .value)
          echo "::add-mask::$TOKEN"
          echo "OIDC_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          # Print the non-secret claims so you can compare sub/aud/iss with the Snowflake user
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{iss, sub, aud}' || true

      - name: Liquibase connect
        run: |
          URL="jdbc:snowflake://${SF_ACCOUNT}.snowflakecomputing.com/?authenticator=WORKLOAD_IDENTITY&workloadIdentityProvider=OIDC&token=${OIDC_TOKEN}&db=LB_WIF_TEST&schema=PUBLIC&warehouse=LB_WIF_TEST_WH&role=LB_WIF_TEST_ROLE"
          docker run --rm -v "$PWD:/liquibase/changelog" "$LB_IMAGE" \
            --search-path=/liquibase/changelog \
            --changelog-file=changelog.yaml \
            --url="$URL" \
            --log-level=INFO \
            connect

      - name: Liquibase update
        run: |
          URL="jdbc:snowflake://${SF_ACCOUNT}.snowflakecomputing.com/?authenticator=WORKLOAD_IDENTITY&workloadIdentityProvider=OIDC&token=${OIDC_TOKEN}&db=LB_WIF_TEST&schema=PUBLIC&warehouse=LB_WIF_TEST_WH&role=LB_WIF_TEST_ROLE"
          docker run --rm -v "$PWD:/liquibase/changelog" "$LB_IMAGE" \
            --search-path=/liquibase/changelog \
            --changelog-file=changelog.yaml \
            --url="$URL" \
            update
