name: 'Liquibase Secure Connect for Snowflake OIDC (Workload Identity Federation)'
run-name: ${{ inputs.environment }} connect of current repo by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment for build'
        type: environment
        required: true
        default: DEV

permissions:
  id-token: write   # required for the OIDC token
  contents: read

env:
  LIQUIBASE_LICENSE_KEY: ${{ secrets.LIQUIBASE_LICENSE_KEY }}
  LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog.yaml
  ENVIRONMENT: ${{ inputs.environment }}
  LIQUIBASE_LOG_LEVEL: INFO
  LIQUIBASE_LOG_FORMAT: JSON_PRETTY
  LIQUIBASE_LOG_FILE: logs/log.json

jobs:
  database-connect:
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    steps:
    - uses: actions/checkout@v4

    - name: Setup Liquibase Environment
      uses: ./.github/workflows/setup-liquibase

    - name: Get GitHub OIDC token
      run: |
        TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=snowflakecomputing.com" | jq -r .value)
        echo "::add-mask::$TOKEN"
        echo "OIDC_TOKEN=$TOKEN" >> "$GITHUB_ENV"
        # Show the claims Snowflake will check (not secret)
        echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{iss, sub, aud}' || true

    - name: Liquibase Connect
      env:
        LIQUIBASE_COMMAND_URL: ${{ vars.LIQUIBASE_URL }}&token=${{ env.OIDC_TOKEN }}
      run: liquibase connect